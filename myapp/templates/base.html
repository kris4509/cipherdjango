<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>{% block title %}People{% endblock %} · PeopleDesk</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17233b;
            --muted: #71809a;
            --line: #e7ebf3;
            --surface: #fff;
            --canvas: #f5f7fb;
            --primary: #635bdb;
            --primary-dark: #4f46c7;
            --mint: #e8f8f2;
            --danger: #c34254;
            --shadow: 0 18px 55px rgba(34, 48, 82, .08);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --ink: #edf0fb;
            --muted: #a1abc0;
            --line: #303a4e;
            --surface: #1b2433;
            --canvas: #111827;
            --primary: #a39bff;
            --primary-dark: #8d83f5;
            --danger: #ff9aa6;
            --shadow: 0 18px 55px rgba(0, 0, 0, .22);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 88% 0%, rgba(196, 230, 255, .36), transparent 34rem),
                var(--canvas);
            color: var(--ink);
            font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }
        html { scroll-behavior: smooth; }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 5;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 6vw, 88px);
            background: rgba(255, 255, 255, .82);
            border-bottom: 1px solid rgba(231, 235, 243, .9);
            backdrop-filter: blur(14px);
        }
        .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 750; letter-spacing: -.04em; }
        .brand-mark {
            width: 36px; height: 36px; display: grid; place-items: center;
            border-radius: 12px; color: white; font-size: 17px;
            background: linear-gradient(145deg, #8179f1, #544bd0);
            box-shadow: 0 7px 16px rgba(99, 91, 219, .25);
        }
        .topbar-actions { display: flex; align-items: center; gap: 22px; }
        .topbar-note { color: var(--muted); font-size: 13px; }
        .theme-toggle {
            min-height: 38px; display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px;
            background: var(--surface); color: var(--ink); cursor: pointer;
            font-size: 12px; font-weight: 700; transition: .18s ease;
        }
        .theme-toggle:hover { border-color: var(--primary); transform: translateY(-1px); }
        .workspace {
            width: min(1480px, 100%); min-height: calc(100vh - 76px); margin: 0 auto;
            display: grid; grid-template-columns: 228px minmax(0, 1fr);
        }
        .sidebar {
            padding: 38px 16px; border-right: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface) 44%, transparent);
        }
        .sidebar-label { margin: 0 12px 12px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
        .sidebar-nav { display: grid; gap: 6px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 12px; padding: 11px 12px;
            border: 1px solid transparent; border-radius: 11px; color: var(--muted);
            font-size: 13px; font-weight: 650; transition: .18s ease;
        }
        .sidebar-link:hover { transform: translateX(3px); background: var(--surface); color: var(--ink); }
        .sidebar-link[aria-current="page"] { border-color: rgba(99, 91, 219, .12); background: rgba(99, 91, 219, .1); color: var(--primary); }
        .sidebar-icon { width: 20px; text-align: center; font-size: 16px; }
        .page { width: 100%; max-width: 1220px; min-width: 0; margin: 50px auto 64px; padding: 0 clamp(24px, 4vw, 56px); }
        .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
        .eyebrow { margin: 0 0 8px; color: var(--primary); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 7px; font-size: clamp(29px, 4vw, 38px); line-height: 1.15; letter-spacing: -.055em; }
        .subtitle { margin: 0; color: var(--muted); }
        .panel { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
        .panel-body { padding: clamp(22px, 4vw, 36px); }
        .button {
            min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 9px 16px; border: 1px solid transparent; border-radius: 11px;
            cursor: pointer; font-size: 13px; font-weight: 700; transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
        }
        .button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(34, 48, 82, .12); }
        .button:focus-visible, .theme-toggle:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(99, 91, 219, .28); outline-offset: 3px; }
        .button-primary { background: var(--primary); color: white; box-shadow: 0 7px 14px rgba(99, 91, 219, .18); }
        .button-primary:hover { background: var(--primary-dark); }
        .button-quiet { background: #f5f6fb; border-color: var(--line); color: #43516c; }
        .button-danger { background: #fff0f1; color: var(--danger); }
        .button-small { min-height: 34px; padding: 6px 10px; font-size: 12px; }
        .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
        .record-count { color: var(--muted); font-size: 13px; }
        .filter-controls { display: flex; align-items: center; gap: 9px; }
        .search, .filter-select { min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
        .search { width: min(250px, 28vw); }
        .filter-select { max-width: 180px; font-size: 12px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 13px 18px; background: color-mix(in srgb, var(--surface) 72%, var(--canvas)); color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
        td { padding: 15px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; white-space: nowrap; }
        tbody tr { transition: background .15s ease, transform .15s ease; }
        tbody tr:hover { background: color-mix(in srgb, var(--primary) 5%, var(--surface)); }
        .person { display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 700; }
        .avatar { width: 40px; height: 40px; object-fit: cover; border-radius: 13px; background: color-mix(in srgb, var(--primary) 12%, var(--surface)); }
        .avatar-fallback { display: grid; place-items: center; color: var(--primary); font-weight: 800; }
        .actions { display: flex; align-items: center; gap: 7px; }
        .empty-state { padding: 56px 24px; text-align: center; }
        .empty-icon { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 18px; background: color-mix(in srgb, var(--primary) 12%, var(--surface)); color: var(--primary); font-size: 25px; }
        .empty-state h2 { margin-bottom: 7px; font-size: 20px; letter-spacing: -.03em; }
        .empty-state p { margin-bottom: 20px; color: var(--muted); }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .form-grid p { min-width: 0; margin: 0; }
        .form-grid label { display: block; margin-bottom: 7px; color: #44516a; font-size: 13px; font-weight: 700; }
        .form-grid input, .form-grid select, .form-grid textarea {
            width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #dfe4ee;
            border-radius: 10px; background: var(--surface); color: var(--ink);
        }
        .form-grid input[type="file"] { padding: 8px; }
        .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: #9c97ec; outline: 3px solid rgba(99, 91, 219, .12); }
        .helptext, .form-grid .helptext { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
        .errorlist { margin: 5px 0 0; padding: 0; color: var(--danger); font-size: 12px; list-style: none; }
        .form-actions { display: flex; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
        .detail-photo { width: 76px; height: 76px; object-fit: cover; border-radius: 22px; background: color-mix(in srgb, var(--primary) 12%, var(--surface)); }
        .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin: 24px 0 0; }
        .detail-item { padding: 17px 0; border-top: 1px solid var(--line); }
        .detail-item dt { margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
        .detail-item dd { margin: 0; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
        .confirm-icon { width: 58px; height: 58px; display: grid; place-items: center; margin-bottom: 18px; border-radius: 18px; background: #fff0f1; color: var(--danger); font-size: 25px; }
        .confirmation { max-width: 560px; margin: 0 auto; }
        .footer-note { margin: 30px 0 0; color: var(--muted); text-align: center; font-size: 12px; }
        .panel { animation: rise-in .38s ease both; }
        @keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
        html[data-theme="dark"] body { background: radial-gradient(ellipse at 88% 0%, rgba(73, 82, 155, .18), transparent 34rem), var(--canvas); }
        html[data-theme="dark"] .topbar { background: rgba(24, 33, 48, .9); border-color: var(--line); }
        html[data-theme="dark"] .button-quiet { background: #252f40; color: var(--ink); }
        html[data-theme="dark"] .button-primary { color: #17162d; }
        html[data-theme="dark"] .button-danger { background: #3b2630; }
        html[data-theme="dark"] .form-grid input,
        html[data-theme="dark"] .form-grid select,
        html[data-theme="dark"] .form-grid textarea { border-color: var(--line); }
        html[data-theme="dark"] .form-grid label { color: #d3d9e7; }
        html[data-theme="dark"] .confirm-icon { background: #3b2630; }
        html[data-theme="dark"] .detail-photo { background: #252d45; }
        @media (max-width: 720px) {
            .topbar { height: 66px; padding-inline: 20px; }
            .topbar-note { display: none; }
            .topbar-actions { gap: 0; }
            .workspace { min-height: calc(100vh - 66px); grid-template-columns: 1fr; }
            .sidebar { padding: 12px 20px; border-right: 0; border-bottom: 1px solid var(--line); }
            .sidebar-label { display: none; }
            .sidebar-nav { display: flex; gap: 8px; overflow-x: auto; }
            .sidebar-link { flex: 0 0 auto; padding: 8px 11px; }
            .page { margin: 30px auto 48px; padding-inline: 20px; }
            .page-heading { align-items: start; flex-direction: column; }
            .table-tools { align-items: stretch; flex-direction: column; }
            .filter-controls { display: grid; grid-template-columns: 1fr 1fr; }
            .search { width: 100%; grid-column: 1 / -1; }
            .filter-select { width: 100%; max-width: none; }
            .form-grid, .detail-grid { grid-template-columns: 1fr; }
            th, td { padding-inline: 13px; }
        }
        @media (max-width: 400px) {
            .theme-toggle { padding-inline: 9px; }
            .theme-label { display: none; }
            .filter-controls { grid-template-columns: 1fr; }
            .search { grid-column: auto; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
        html[data-theme="dark"] .form-grid input:focus,
        html[data-theme="dark"] .form-grid select:focus,
        html[data-theme="dark"] .form-grid textarea:focus { border-color: var(--primary); }
        html[data-theme="dark"] .button:hover { box-shadow: 0 8px 18px rgba(0, 0, 0, .25); }
    </style>
    <script>
        const savedTheme = localStorage.getItem("peopledesk-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'user_list' %}"><span class="brand-mark" aria-hidden="true">P</span>PeopleDesk</a>
        <div class="topbar-actions">
            <span class="topbar-note">A calmer way to manage your people</span>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                <span id="theme-icon" aria-hidden="true">☾</span><span class="theme-label" id="theme-label">Dark mode</span>
            </button>
        </div>
    </header>
    <div class="workspace">
        <aside class="sidebar" aria-label="Main navigation">
            <p class="sidebar-label">Workspace</p>
            <nav class="sidebar-nav">
                <a class="sidebar-link" href="{% url 'user_list' %}" {% if request.resolver_match.url_name != 'add_user' %}aria-current="page"{% endif %}>
                    <span class="sidebar-icon" aria-hidden="true">▦</span>Directory
                </a>
                <a class="sidebar-link" href="{% url 'add_user' %}" {% if request.resolver_match.url_name == 'add_user' %}aria-current="page"{% endif %}>
                    <span class="sidebar-icon" aria-hidden="true">＋</span>Add a person
                </a>
            </nav>
        </aside>
        <main class="page">
            {% block content %}{% endblock %}
            <p class="footer-note">PeopleDesk · Simple, thoughtful record keeping</p>
        </main>
    </div>
    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const themeLabel = document.getElementById("theme-label");
        const themeIcon = document.getElementById("theme-icon");

        function updateThemeControl(theme) {
            const isDark = theme === "dark";
            themeToggle.setAttribute("aria-pressed", String(isDark));
            themeToggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} mode`);
            themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
            themeIcon.textContent = isDark ? "☀" : "☾";
        }

        updateThemeControl(document.documentElement.dataset.theme);
        themeToggle.addEventListener("click", () => {
            const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = nextTheme;
            localStorage.setItem("peopledesk-theme", nextTheme);
            updateThemeControl(nextTheme);
        });
    </script>
</body>
</html>
